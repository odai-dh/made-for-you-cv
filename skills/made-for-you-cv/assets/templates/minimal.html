<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="UTF-8">
<title>{{NAME}} - CV</title>
<style>
  @page {
    size: A4;
    margin: 18mm 20mm;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 10.5pt;
    line-height: 1.45;
    color: #1a1a1a;
  }
  header {
    margin-bottom: 14pt;
  }
  header h1 {
    margin: 0 0 2pt 0;
    font-size: 20pt;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  header .role {
    font-size: 11pt;
    color: #444;
    margin-bottom: 6pt;
  }
  header .contact {
    font-size: 9.5pt;
    color: #555;
  }
  header .contact a { color: #555; text-decoration: none; }
  header .contact .sep { margin: 0 6pt; color: #aaa; }

  section { margin-bottom: 12pt; }
  h2 {
    font-size: 9pt;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #888;
    margin: 0 0 6pt 0;
    padding-bottom: 3pt;
    border-bottom: 1px solid #e5e5e5;
  }
  .summary { color: #333; }

  .entry { margin-bottom: 9pt; }
  .entry-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 1pt;
  }
  .entry-title { font-weight: 600; font-size: 10.5pt; }
  .entry-meta { color: #666; font-size: 9.5pt; white-space: nowrap; }
  .entry-sub { color: #555; font-size: 9.5pt; margin-bottom: 3pt; font-style: italic; }
  .entry ul { margin: 3pt 0 0 14pt; padding: 0; }
  .entry li { margin-bottom: 2pt; }
  .entry .tech { color: #666; font-size: 9pt; margin-top: 3pt; }

  .skills-group { margin-bottom: 4pt; }
  .skills-group strong { color: #333; }

  .languages span { margin-right: 12pt; color: #444; }

  a { color: inherit; }
  .entry { break-inside: avoid; }
  h2 { break-after: avoid; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
</style>
</head>
<body>

<header>
  <h1>{{NAME}}</h1>
  <div class="role">{{TITLE}}</div>
  <div class="contact"><!--CONTACT-->
    <!--IF:LOCATION--><span>{{LOCATION}}</span><span class="sep">·</span><!--/IF:LOCATION-->
    <!--IF:EMAIL--><a href="mailto:{{EMAIL}}">{{EMAIL}}</a><span class="sep">·</span><!--/IF:EMAIL-->
    <!--IF:PHONE--><span>{{PHONE}}</span><span class="sep">·</span><!--/IF:PHONE-->
    <!--IF:PORTFOLIO--><a href="{{PORTFOLIO}}">{{PORTFOLIO_DISPLAY}}</a><span class="sep">·</span><!--/IF:PORTFOLIO-->
    <!--IF:GITHUB--><a href="{{GITHUB}}">{{GITHUB_DISPLAY}}</a><span class="sep">·</span><!--/IF:GITHUB-->
    <!--IF:LINKEDIN--><a href="{{LINKEDIN}}">{{LINKEDIN_DISPLAY}}</a><span class="sep">·</span><!--/IF:LINKEDIN-->
  <!--/CONTACT--></div>
</header>

<section class="summary">
  {{SUMMARY}}
</section>

<section>
  <h2>Experience</h2>
  {{EXPERIENCE_BLOCK}}
</section>

<!--IF:PROJECTS_BLOCK-->
<section>
  <h2>Selected Projects</h2>
  {{PROJECTS_BLOCK}}
</section>
<!--/IF:PROJECTS_BLOCK-->

<!--IF:EDUCATION_BLOCK-->
<section>
  <h2>Education</h2>
  {{EDUCATION_BLOCK}}
</section>
<!--/IF:EDUCATION_BLOCK-->

<!--IF:SKILLS_BLOCK-->
<section>
  <h2>Skills</h2>
  {{SKILLS_BLOCK}}
</section>
<!--/IF:SKILLS_BLOCK-->

<!--IF:LANGUAGES_BLOCK-->
<section>
  <h2>Languages</h2>
  <div class="languages">{{LANGUAGES_BLOCK}}</div>
</section>
<!--/IF:LANGUAGES_BLOCK-->

</body>
</html>
